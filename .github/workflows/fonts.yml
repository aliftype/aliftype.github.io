name: Update fonts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-fonts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get install --yes libicu-dev pkg-config
      - run: pip install -r requirements.txt uharfbuzz playwright
      - run: playwright install --with-deps chromium
      - run: sudo apt-get install --yes woff2

      - name: Update the fonts
        run: scripts/update-fonts.sh "$RUNNER_TEMP/body.md"

      - name: Open a pull request
        run: |
          if git diff --quiet; then
            echo "Fonts are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          open_pr=$(gh pr list --state open \
            --search "author:app/github-actions head:update-fonts-" \
            --json number --jq '.[0].number // ""')
          if [ -n "$open_pr" ]; then
            branch=$(gh pr view "$open_pr" --json headRefName --jq .headRefName)
          else
            branch="update-fonts-$(date -u +%Y-%m-%d)"
          fi
          git switch -C "$branch"
          git commit -am "Update fonts"
          git push -f origin "$branch"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --head "$branch" --title "Update fonts" \
              --body-file "$RUNNER_TEMP/body.md"; then
            git push --delete origin "$branch"
            exit 1
          fi
